<div class="container-fluid">
  <!-- Loader -->
  @if (loading()) {
    <div class="loader-overlay">
      <mat-spinner diameter="100"></mat-spinner>
    </div>
  }

  <!-- Filter -->
  <app-filter-box [parameters]="filterParams()" (applyFilters)="applyFilters($event)">
  </app-filter-box>

  <div class="d-flex flex-column align-items-center">
    <!-- Back Button -->
    <button mat-stroked-button color="primary" class="back-btn mb-4" (click)="back()">Back</button>

    <!-- No Results -->
    @if (!loading() && getCharacters().length === 0) {
      <div class="mt-4">
        <h4>No characters found</h4>
      </div>
    }

    <!-- Character Grid -->
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4 w-100">
      @for (item of getCharacters(); track item.id) {
        <div class="col">
          <app-card [cardInfo]="item" (selected)="onCardSelection($event)"> </app-card>
        </div>
      }
    </div>

    <!-- Pagination -->
    @if (!loading() && getCharacters().length > 0 && totalPages() > 1) {
      <div class="pagination-container mt-5">
        <button mat-stroked-button (click)="prevPage()" [disabled]="page() === 1">← Prev</button>

        <span class="page-info"> Page {{ page() }} of {{ totalPages() }} </span>

        <button mat-stroked-button (click)="nextPage()" [disabled]="page() === totalPages()">
          Next →
        </button>
      </div>
    }
  </div>
</div>
