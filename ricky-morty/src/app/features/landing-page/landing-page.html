<button
  style="
    position: absolute;
    top: 1rem;
    right: 1rem;
    z-index: 10;
    font-size: 1.5rem;
    padding: 0.5rem 1rem;
    cursor: pointer;
  "
  matButton="outlined"
  (click)="toggleTheme()"
>
  {{ themeLabel }}
</button>
<main class="main">
  <div class="content">
    <div class="left-side">
      <h1>Welcome to {{ title() }}</h1>
      <button class="explore-button" matButton="elevated" routerLink="/characters">
        Explore Now
      </button>
    </div>
  </div>
</main>
<app-loader></app-loader>
