<mat-slide-toggle class="slide-toggle" [checked]="checked()" (toggleChange)="toggleTheme()">
  {{ themeLabel }}
</mat-slide-toggle>
<main class="main">
  <div class="content">
    <div class="left-side">
      <h1>Welcome to {{ title() }}</h1>
      <button class="explore-button" matButton="elevated" routerLink="/characters">
        Explore Now
      </button>
    </div>
  </div>
</main>
<app-loader></app-loader>
