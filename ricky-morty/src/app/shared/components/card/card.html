<mat-card class="responsive-card mat-elevation-z4">
  <div class="image-section">
    <img [src]="cardInfo().image" alt="Character" />
  </div>

  <div class="content-section">
    <mat-card-header>
      <mat-card-title>{{ cardInfo().name }}</mat-card-title>
      <mat-card-subtitle>{{ cardInfo().species }}</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content> {{ cardInfo().gender }} </mat-card-content>
  </div>
</mat-card>
